[ABOUT]
NAME = ACUIR
FULL_NAME = Assetto Corsa UI Replacement
AUTHOR = Schmawlik
VERSION = 0.8.0.3
VERSION_CODE = 803
VERSION_DATE = 2025-05-08
REQUIRED_VERSION = 3321
DESCRIPTION = Advanced UI replacement

[CORE]
IMMEDIATE=1
LAZY = 0

[WINDOW_...]
ID = main
NAME = ACUIR
ICON = icon.png
FUNCTION_MAIN = main
FLAGS = NO_TITLE_BAR,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE,FIXED_SIZE
SIZE = 1,1
