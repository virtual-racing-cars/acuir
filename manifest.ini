[ABOUT]
NAME = ACUIR
FULL_NAME = Assetto Corsa UI Replacement
AUTHOR = Schmawlik
VERSION = 0.9.2.7
VERSION_CODE = 927
VERSION_DATE = 2025-06-16
DESCRIPTION = Advanced UI replacement

[CORE]
IMMEDIATE=1
LAZY = 0

[WINDOW_...]
ID = main
NAME = ACUIR
ICON = icon.png
FUNCTION_MAIN = main
FLAGS = NO_TITLE_BAR,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE,FIXED_SIZE
SIZE = 1,1
DEFAULT_POSITION = 10000, 10000
BACKGROUND_COLOR = 0,0,0,0

[WINDOW_...]
ID = entryWindow
NAME = ACUIR Entry
ICON = icon.png
FUNCTION_MAIN = entryWindow
FLAGS = NO_TITLE_BAR,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE,SETUP_HIDDEN,AUTO_RESIZE
SIZE = 1,1
PADDING = 0,0
DEFAULT_POSITION = 400,300
BACKGROUND_COLOR=0,0,0,0

[WINDOW_...]
ID = pitstopWindow
NAME = ACUIR Quick Pit Menu
ICON = icon.png
FUNCTION_MAIN = pitstopWindow
FLAGS = NO_TITLE_BAR,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE,HIDDEN,AUTO_RESIZE
SIZE = 1,1
PADDING = 0,0
DEFAULT_POSITION = 0, 0
BACKGROUND_COLOR = 0,0,0,0

