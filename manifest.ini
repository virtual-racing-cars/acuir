BACKGROUND_COLOR = 0,0,0,0

[WINDOW_...]
ID = pitstopWindow
NAME = ACUIR
ICON = icon.png
FUNCTION_MAIN = pitstopWindow
FLAGS = NO_TITLE_BAR,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE,HIDDEN,AUTO_RESIZE
SIZE = 1,1
PADDING = 0,0
DEFAULT_POSITION = 0, 0
BACKGROUND_COLOR = 0,0,0,0

[DEV]
DEBUG_MODE = 1
